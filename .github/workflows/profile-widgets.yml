# Keeps the profile README widgets fresh. Everything is generated inside this repo,
# so nothing depends on a shared public server that can go down or get rate-limited.
#
#  1. 3D contribution graph + stats  -> profile-3d-contrib/   (replaces streak-stats & activity-graph)
#  2. Snake animation                -> `output` branch
#  3. Latest Hashnode blog posts     -> README.md (between the BLOG-POST-LIST markers)

name: Update profile README

on:
  schedule:
    - cron: "30 18 * * *" # every day at 00:00 IST
  workflow_dispatch: # lets you run it from the Actions tab
  push: # runs once right away when this file is added or changed
    paths:
      - ".github/workflows/profile-widgets.yml"

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # 1. 3D contribution calendar with contribution, star, fork and language stats
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit 3D contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib || true
          if git commit -m "chore: update 3D contribution graph"; then
            git push
          fi

      # 2. Snake that eats the contribution grid (light + dark)
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        continue-on-error: true
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Latest posts from blog.anmolthedeveloper.com
      - name: Update latest blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://blog.anmolthedeveloper.com/rss.xml"
          max_post_count: 5
          commit_message: "chore: update latest blog posts"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
